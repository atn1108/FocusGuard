<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="newtab.css">
</head>

<body>

<main class="home">

  <header class="topbar">
    <div class="brand">
      <img src="../icons/48.png" alt="FocusGuard" class="logo">
      <span class="brand-name">FocusGuard</span>
    </div>
    <div class="top-actions">
      <div class="lang-switch" id="lang-switch" title="Language">
        <span class="lang-label" id="lang-label">VI</span>
      </div>
      <button class="icon-btn" id="open-options" title="Cài đặt">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="grid">

    <div class="card focus-card">
      <h2 class="card-title" data-i18n="newtabTitle">Hôm nay bạn định hoàn thành gì?</h2>
      <div class="task-list" id="task-list"></div>
      <input type="text" id="task-input" class="task-input" data-i18n="taskPlaceholder" placeholder="+ Thêm việc cần làm...">
    </div>

    <div class="card pomo-card" id="pomo-card">
      <h2 class="card-title">Pomodoro</h2>
      <div class="pomo-big" id="pomo-timer">25:00</div>
      <div class="pomo-phase" id="pomo-phase" data-i18n="focusSession">Đang tập trung</div>
      <div class="pomo-bar"><div class="pomo-bar-fill" id="pomo-progress" style="width:0%"></div></div>
    </div>

    <div class="card usage-card">
      <h2 class="card-title" data-i18n="today">Hôm nay</h2>
      <div id="today-list" class="today-list"></div>
      <div class="today-total" id="today-total"></div>
    </div>

    <div class="card streak-card">
      <div class="streak-line">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span data-i18n="streak">Chuỗi</span>
        <strong id="streak-count">0</strong>
        <span data-i18n="days">ngày</span>
      </div>
      <button class="pause-btn" id="pause-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="pause5min">Tạm dừng 5 phút</span>
      </button>
    </div>

  </section>

  <footer class="foot">
    <span>FocusGuard v3.0 — <span data-i18n="privacyNote">Theo dõi hoàn toàn cục bộ, không thu thập dữ liệu.</span></span>
  </footer>

</main>

<script src="../i18n.js"></script>
<script src="../sites.js"></script>
<script src="newtab.js"></script>

</body>
</html>
