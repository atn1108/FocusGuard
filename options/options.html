<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusGuard - Cai dat</title>
<link rel="stylesheet" href="options.css">
</head>

<body>

<div class="page">

  <div class="hero">
    <div class="shield-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>FocusGuard</h1>
    <p>Cai dat chan noi dung gay mat tap trung</p>
  </div>

  <div class="card">

    <div class="card-title">Chan theo nen tang</div>

    <div class="platform-list">

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon yt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.5 15.5v-7L16 12l-6.5 3.5z"/></svg>
          </div>
          <div class="platform-text">
            <span class="name">YouTube Shorts</span>
            <span class="desc">Chan /shorts/*</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="youtube" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon tt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.11V9a6.33 6.33 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.3a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V9.13a8.28 8.28 0 0 0 4.83 1.55V7.24a4.83 4.83 0 0 1-1.07-.55z"/></svg>
          </div>
          <div class="platform-text">
            <span class="name">TikTok</span>
            <span class="desc">Chan toan trang</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="tiktok" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon ig">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </div>
          <div class="platform-text">
            <span class="name">Instagram Reels</span>
            <span class="desc">Chan /reel*, /reels*</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="instagram" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon fb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.08 24 18.09 24 12.07z"/></svg>
          </div>
          <div class="platform-text">
            <span class="name">Facebook Reels</span>
            <span class="desc">Chan /reel*, /reels*</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="facebook" checked>
          <span class="slider"></span>
        </label>
      </div>

    </div>

    <div class="card-divider"></div>

    <div class="card-title">Tam ngung</div>

    <button id="allow" class="allow-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Tao 5 phut
    </button>
    <p class="hint">Tam ngung tat ca cau truc trong 5 phut.</p>

    <p id="saved" class="saved"></p>

  </div>

  <div class="footer">FocusGuard v1.5</div>

</div>

<script src="options.js"></script>

</body>
</html>
