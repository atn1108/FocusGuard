<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusGuard</title>
<link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="popup">

  <div class="header">
    <div class="header-left">
      <div class="shield-icon">
        <img src="../icons/48.png" alt="FocusGuard" class="app-icon">
      </div>
      <div class="title-group">
        <span class="title">FocusGuard</span>
        <span class="version">v2.0</span>
      </div>
    </div>
    <div class="header-right">
      <div class="theme-switch" id="theme-switch" title="Đổi giao diện">
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </div>
      <label class="toggle" title="Bật/Tắt FocusGuard">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section" id="pomodoro-section" style="display:none;">
    <div class="section-title">Pomodoro</div>
    <div class="pomodoro-card" id="pomodoro-card">
      <div class="pomo-status" id="pomo-status">
        <div class="pomo-head">
          <div class="pomo-phase" id="pomo-phase">Đang tập trung</div>
          <div class="pomo-source" id="pomo-source">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M9 11h6"/></svg>
            MindSeed
          </div>
        </div>
        <div class="pomo-timer" id="pomo-timer">25:00</div>
        <div class="pomo-progress-bar">
          <div class="pomo-progress-fill" id="pomo-progress"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="daily-goal-section" style="display:none;">
    <div class="section-title">Mục tiêu hôm nay</div>
    <div class="daily-goal-card">
      <div class="goal-info">
        <span class="goal-count" id="goal-current">0</span>
        <span class="goal-sep">/</span>
        <span class="goal-max" id="goal-max">3</span>
        <span class="goal-label">lượt bypass</span>
      </div>
      <div class="goal-bar">
        <div class="goal-bar-fill" id="goal-bar-fill"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Chặn nội dung</div>

    <div class="platform-list">

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon yt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.5 15.5v-7L16 12l-6.5 3.5z"/></svg>
          </div>
          <span class="platform-name">YouTube Shorts</span>
        </div>
        <div class="platform-right">
          <span class="countdown" id="cd-youtube"></span>
          <label class="toggle small">
            <input type="checkbox" id="youtube" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon tt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.11V9a6.33 6.33 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.3a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V9.13a8.28 8.28 0 0 0 4.83 1.55V7.24a4.83 4.83 0 0 1-1.07-.55z"/></svg>
          </div>
          <span class="platform-name">TikTok</span>
        </div>
        <div class="platform-right">
          <span class="countdown" id="cd-tiktok"></span>
          <label class="toggle small">
            <input type="checkbox" id="tiktok" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon ig">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </div>
          <span class="platform-name">Instagram Reels</span>
        </div>
        <div class="platform-right">
          <span class="countdown" id="cd-instagram"></span>
          <label class="toggle small">
            <input type="checkbox" id="instagram" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="platform-item">
        <div class="platform-info">
          <div class="platform-icon fb">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.08 24 18.09 24 12.07z"/></svg>
          </div>
          <span class="platform-name">Facebook Reels</span>
        </div>
        <div class="platform-right">
          <span class="countdown" id="cd-facebook"></span>
          <label class="toggle small">
            <input type="checkbox" id="facebook" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title">Bảo mật</div>

    <div class="feature-row">
      <div class="feature-info">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Chế độ nghiêm ngặt</span>
      </div>
      <label class="toggle small">
        <input type="checkbox" id="strictMode">
        <span class="slider"></span>
      </label>
    </div>

  </div>

  <div class="section stats-section">
    <div class="section-title">Thống kê hôm nay</div>
    <div class="stats-grid" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-youtube">0</div>
        <div class="stat-label">YouTube</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-tiktok">0</div>
        <div class="stat-label">TikTok</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-instagram">0</div>
        <div class="stat-label">Instagram</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-facebook">0</div>
        <div class="stat-label">Facebook</div>
      </div>
    </div>
    <div class="streak-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Chuỗi: <strong id="streak-count">0</strong> ngày</span>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="open-options">Cài đặt nâng cao</a>
    <span class="footer-sep">|</span>
    <span>FocusGuard v2.0</span>
  </div>

</div>

<script src="popup.js"></script>

</body>
</html>
